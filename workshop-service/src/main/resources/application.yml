server:
  port: 8082

spring:
  application:
    name: workshop-service
  # Datasource is entirely environment driven. With no variables set it falls
  # back to in-memory H2, so local development and tests need no database.
  # In Kubernetes the Deployment supplies PostgreSQL values from a Secret.
  datasource:
    url: ${DB_URL:jdbc:h2:mem:workshopdb;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 10000
  jpa:
    hibernate:
      # create-drop for throwaway H2, update for a real database that must
      # survive a pod restart.
      ddl-auto: ${DDL_AUTO:create-drop}
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

autocare:
  customers-service:
    # Overridden by CUSTOMERS_SERVICE_URL in Docker and Kubernetes
    url: ${CUSTOMERS_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: AutoCare Workshop Service
    description: Owns mechanics, specialties and service jobs

logging:
  level:
    com.autocare: INFO

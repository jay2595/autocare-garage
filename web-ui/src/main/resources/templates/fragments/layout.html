<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'AutoCare · ' + ${title}">AutoCare Garage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
          rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: { 950: '#08090c', 900: '#0b0d11', 800: '#101318', 700: '#161a21', 600: '#1e232c' },
                        line: '#272d38'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-image: radial-gradient(circle at 20% -10%, #15181f 0%, #0b0d11 55%); }
        .grid-lines { background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px); background-size: 44px 44px; }
    </style>
</head>

<body>

<header th:fragment="nav(active)"
        class="sticky top-0 z-20 border-b border-line bg-ink-950/85 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center gap-8 px-6 py-3">

        <a href="/" class="flex items-center gap-2.5 shrink-0">
            <span class="flex h-8 w-8 items-center justify-center rounded-sm bg-amber-500 font-mono text-sm font-bold text-ink-950">AC</span>
            <span class="text-[15px] font-semibold tracking-tight text-zinc-100">AutoCare<span class="text-amber-500">.</span></span>
            <span class="hidden font-mono text-[10px] uppercase tracking-[0.18em] text-zinc-600 sm:inline">Garage Ops</span>
        </a>

        <nav class="flex items-center gap-1 text-sm">
            <a href="/" class="rounded-sm px-3 py-1.5 text-zinc-400 transition hover:bg-ink-700 hover:text-zinc-100"
               th:classappend="${active == 'dashboard'} ? 'bg-ink-700 text-zinc-100 ring-1 ring-line' : ''">Dashboard</a>
            <a href="/jobs" class="rounded-sm px-3 py-1.5 text-zinc-400 transition hover:bg-ink-700 hover:text-zinc-100"
               th:classappend="${active == 'jobs'} ? 'bg-ink-700 text-zinc-100 ring-1 ring-line' : ''">Job board</a>
            <a href="/customers" class="rounded-sm px-3 py-1.5 text-zinc-400 transition hover:bg-ink-700 hover:text-zinc-100"
               th:classappend="${active == 'customers'} ? 'bg-ink-700 text-zinc-100 ring-1 ring-line' : ''">Customers</a>
            <a href="/mechanics" class="rounded-sm px-3 py-1.5 text-zinc-400 transition hover:bg-ink-700 hover:text-zinc-100"
               th:classappend="${active == 'mechanics'} ? 'bg-ink-700 text-zinc-100 ring-1 ring-line' : ''">Mechanics</a>
            <a href="/status" class="rounded-sm px-3 py-1.5 text-zinc-400 transition hover:bg-ink-700 hover:text-zinc-100"
               th:classappend="${active == 'status'} ? 'bg-ink-700 text-zinc-100 ring-1 ring-line' : ''">Services</a>
        </nav>

        <div class="ml-auto flex items-center gap-3">
            <a href="/jobs/new"
               class="rounded-sm bg-amber-500 px-3.5 py-1.5 text-sm font-semibold text-ink-950 transition hover:bg-amber-400">
                Book a job
            </a>
        </div>
    </div>
</header>

<div th:fragment="flash" class="mx-auto max-w-7xl px-6">
    <div th:if="${message}"
         class="mt-5 rounded-sm border border-emerald-800 border-l-4 border-l-emerald-500 bg-emerald-950/40 px-4 py-3 text-sm text-emerald-300"
         th:text="${message}"></div>
    <div th:if="${error}"
         class="mt-5 rounded-sm border border-red-900 border-l-4 border-l-red-500 bg-red-950/40 px-4 py-3 text-sm text-red-300"
         th:text="${error}"></div>
</div>

<footer th:fragment="footer" class="mt-20 border-t border-line">
    <div class="mx-auto flex max-w-7xl flex-col gap-1 px-6 py-8 font-mono text-[11px] uppercase tracking-[0.15em] text-zinc-600 sm:flex-row sm:items-center sm:justify-between">
        <span>AutoCare Garage &middot; three Spring Boot services</span>
        <span>web-ui &rarr; customers-service &rarr; workshop-service</span>
    </div>
</footer>

</body>
</html>

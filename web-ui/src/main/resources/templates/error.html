<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something broke')}"></head>
<body class="min-h-screen bg-ink-900 font-sans text-zinc-300 antialiased">

<header th:replace="~{fragments/layout :: nav('')}"></header>

<main class="mx-auto max-w-2xl px-6 py-24 text-center">
    <p class="font-mono text-6xl font-bold text-ink-600" th:text="${status} ?: 'ERR'">500</p>
    <h1 class="mt-4 text-xl font-semibold text-zinc-100" th:text="${error} ?: 'Unexpected error'">Error</h1>
    <p class="mt-2 font-mono text-xs text-zinc-600" th:text="${path}"></p>
    <a href="/" class="mt-8 inline-block rounded-sm bg-amber-500 px-5 py-2.5 text-sm font-semibold text-ink-950 transition hover:bg-amber-400">
        Back to dashboard
    </a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New customer')}"></head>
<body class="min-h-screen bg-ink-900 font-sans text-zinc-300 antialiased">

<header th:replace="~{fragments/layout :: nav('customers')}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="mx-auto max-w-2xl px-6 py-10">

    <a href="/customers" class="font-mono text-[11px] uppercase tracking-[0.15em] text-zinc-500 hover:text-amber-500">
        &larr; Customers
    </a>
    <h1 class="mt-4 text-2xl font-bold tracking-tight text-zinc-50">New customer</h1>

    <form action="/customers" method="post" class="mt-8 space-y-5 rounded-sm border border-line bg-ink-800 p-7">

        <div class="grid gap-5 sm:grid-cols-2">
            <div>
                <label class="mb-1.5 block font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">First name</label>
                <input name="firstName" required maxlength="50"
                       class="w-full rounded-sm border border-line bg-ink-700 px-3.5 py-2.5 text-sm text-zinc-100 outline-none focus:border-amber-600">
            </div>
            <div>
                <label class="mb-1.5 block font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Last name</label>
                <input name="lastName" required maxlength="50"
                       class="w-full rounded-sm border border-line bg-ink-700 px-3.5 py-2.5 text-sm text-zinc-100 outline-none focus:border-amber-600">
            </div>
        </div>

        <div>
            <label class="mb-1.5 block font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Phone</label>
            <input name="phone" required placeholder="+44 7700 900000"
                   class="w-full rounded-sm border border-line bg-ink-700 px-3.5 py-2.5 font-mono text-sm text-zinc-100 outline-none placeholder:text-zinc-600 focus:border-amber-600">
        </div>

        <div>
            <label class="mb-1.5 block font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Email</label>
            <input type="email" name="email"
                   class="w-full rounded-sm border border-line bg-ink-700 px-3.5 py-2.5 text-sm text-zinc-100 outline-none focus:border-amber-600">
        </div>

        <div class="grid gap-5 sm:grid-cols-2">
            <div>
                <label class="mb-1.5 block font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Address</label>
                <input name="address" maxlength="120"
                       class="w-full rounded-sm border border-line bg-ink-700 px-3.5 py-2.5 text-sm text-zinc-100 outline-none focus:border-amber-600">
            </div>
            <div>
                <label class="mb-1.5 block font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">City</label>
                <input name="city" maxlength="60"
                       class="w-full rounded-sm border border-line bg-ink-700 px-3.5 py-2.5 text-sm text-zinc-100 outline-none focus:border-amber-600">
            </div>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit"
                    class="rounded-sm bg-amber-500 px-5 py-2.5 text-sm font-semibold text-ink-950 transition hover:bg-amber-400">
                Save customer
            </button>
            <a href="/customers"
               class="rounded-sm border border-line px-5 py-2.5 text-sm text-zinc-400 transition hover:text-zinc-100">
                Cancel
            </a>
        </div>
    </form>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

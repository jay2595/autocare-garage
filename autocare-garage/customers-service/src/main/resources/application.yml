server:
  port: 8081

spring:
  application:
    name: customers-service
  datasource:
    url: jdbc:h2:mem:customersdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: AutoCare Customers Service
    description: Owns customers and their vehicles

logging:
  level:
    com.autocare: INFO

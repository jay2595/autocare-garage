# Local verification with containers.
#
#   mvn clean package        <- build all three JARs first
#   docker compose up --build
#   open http://localhost:8080
#
# This mirrors what happens in AKS: three containers, talking to each other
# by service name rather than localhost.

services:

  customers-service:
    build: ./customers-service
    image: autocare/customers-service:local
    container_name: autocare-customers
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  workshop-service:
    build: ./workshop-service
    image: autocare/workshop-service:local
    container_name: autocare-workshop
    ports:
      - "8082:8082"
    environment:
      CUSTOMERS_SERVICE_URL: http://customers-service:8081
    depends_on:
      customers-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  web-ui:
    build: ./web-ui
    image: autocare/web-ui:local
    container_name: autocare-web
    ports:
      - "8080:8080"
    environment:
      CUSTOMERS_SERVICE_URL: http://customers-service:8081
      WORKSHOP_SERVICE_URL: http://workshop-service:8082
    depends_on:
      customers-service:
        condition: service_healthy
      workshop-service:
        condition: service_healthy

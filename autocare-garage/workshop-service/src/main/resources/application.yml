server:
  port: 8082

spring:
  application:
    name: workshop-service
  datasource:
    url: jdbc:h2:mem:workshopdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

autocare:
  customers-service:
    # Overridden by CUSTOMERS_SERVICE_URL in Docker and Kubernetes
    url: ${CUSTOMERS_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: AutoCare Workshop Service
    description: Owns mechanics, specialties and service jobs

logging:
  level:
    com.autocare: INFO

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mechanics')}"></head>
<body class="min-h-screen bg-ink-900 font-sans text-zinc-300 antialiased">

<header th:replace="~{fragments/layout :: nav('mechanics')}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="mx-auto max-w-7xl px-6 py-10">

    <div class="mb-8">
        <p class="font-mono text-[11px] uppercase tracking-[0.22em] text-amber-500">workshop-service</p>
        <h1 class="mt-1 text-2xl font-bold tracking-tight text-zinc-50">Mechanics</h1>
    </div>

    <div th:if="${#lists.isEmpty(mechanics)}"
         class="rounded-sm border border-dashed border-line bg-ink-800/40 px-6 py-16 text-center text-sm text-zinc-500">
        No mechanics found. Is <span class="font-mono text-zinc-400">workshop-service</span> running on :8082?
    </div>

    <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
        <div th:each="m : ${mechanics}" class="rounded-sm border border-line bg-ink-800 p-5">
            <div class="flex items-center gap-4">
                <span class="flex h-11 w-11 items-center justify-center rounded-sm border border-line bg-ink-700 font-mono text-sm font-bold text-amber-500"
                      th:text="${m.initials()}">AW</span>
                <div class="min-w-0">
                    <p class="truncate font-medium text-zinc-100" th:text="${m.fullName()}">Name</p>
                    <p class="font-mono text-[10px] uppercase tracking-[0.12em] text-zinc-600"
                       th:text="${m.hiredLabel()}">since</p>
                </div>
            </div>
            <div class="mt-4 flex flex-wrap gap-1.5 border-t border-line pt-3">
                <span th:each="s : ${m.specialties()}"
                      class="rounded-sm bg-ink-700 px-2 py-0.5 font-mono text-[10px] uppercase tracking-[0.1em] text-zinc-400"
                      th:text="${s.name()}">Skill</span>
                <span th:if="${#lists.isEmpty(m.specialties())}" class="font-mono text-[10px] text-zinc-600">no specialties</span>
            </div>
        </div>
    </div>

    <div class="mt-10" th:unless="${#lists.isEmpty(specialties)}">
        <h2 class="mb-3 font-mono text-[10px] uppercase tracking-[0.18em] text-zinc-500">All specialties</h2>
        <div class="flex flex-wrap gap-2">
            <span th:each="s : ${specialties}"
                  class="rounded-sm border border-line bg-ink-800 px-3 py-1.5 font-mono text-[11px] text-zinc-400"
                  th:text="${s.name()}">Skill</span>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

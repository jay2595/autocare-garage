<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Not found')}"></head>
<body class="min-h-screen bg-ink-900 font-sans text-zinc-300 antialiased">

<header th:replace="~{fragments/layout :: nav(${active})}"></header>

<main class="mx-auto max-w-2xl px-6 py-24 text-center">
    <p class="font-mono text-6xl font-bold text-ink-600">404</p>
    <h1 class="mt-4 text-xl font-semibold text-zinc-100">
        <span th:text="${missing}">Item</span> could not be loaded
    </h1>
    <p class="mt-2 text-sm text-zinc-500">
        Either it does not exist, or the service that owns it is not responding.
    </p>
    <a href="/" class="mt-8 inline-block rounded-sm bg-amber-500 px-5 py-2.5 text-sm font-semibold text-ink-950 transition hover:bg-amber-400">
        Back to dashboard
    </a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Customers')}"></head>
<body class="min-h-screen bg-ink-900 font-sans text-zinc-300 antialiased">

<header th:replace="~{fragments/layout :: nav('customers')}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="mx-auto max-w-7xl px-6 py-10">

    <div class="mb-8 flex flex-wrap items-end justify-between gap-4">
        <div>
            <p class="font-mono text-[11px] uppercase tracking-[0.22em] text-amber-500">customers-service</p>
            <h1 class="mt-1 text-2xl font-bold tracking-tight text-zinc-50">Customers</h1>
        </div>
        <div class="flex gap-2">
            <form action="/customers" method="get" class="flex gap-2">
                <input type="text" name="q" th:value="${q}" placeholder="Search surname"
                       class="rounded-sm border border-line bg-ink-800 px-3.5 py-2 text-sm text-zinc-100 outline-none placeholder:text-zinc-600 focus:border-amber-600">
                <button type="submit"
                        class="rounded-sm border border-line bg-ink-800 px-4 py-2 text-sm text-zinc-300 transition hover:border-zinc-600">
                    Search
                </button>
            </form>
            <a href="/customers/new"
               class="rounded-sm border border-line bg-ink-800 px-4 py-2 text-sm font-medium text-zinc-200 transition hover:border-amber-600 hover:text-amber-400">
                + New
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(customers)}"
         class="rounded-sm border border-dashed border-line bg-ink-800/40 px-6 py-16 text-center text-sm text-zinc-500">
        No customers found. If you expected some, check that
        <span class="font-mono text-zinc-400">customers-service</span> is running on :8081.
    </div>

    <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
        <a th:each="c : ${customers}" th:href="@{'/customers/' + ${c.id()}}"
           class="group rounded-sm border border-line bg-ink-800 p-5 transition hover:border-amber-700 hover:bg-ink-700">
            <div class="flex items-start gap-4">
                <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-sm border border-line bg-ink-700 font-mono text-sm font-bold text-amber-500"
                      th:text="${c.initials()}">PS</span>
                <div class="min-w-0 flex-1">
                    <p class="truncate font-medium text-zinc-100 group-hover:text-amber-400" th:text="${c.fullName()}">Name</p>
                    <p class="mt-0.5 truncate font-mono text-[11px] text-zinc-500" th:text="${c.city()}">City</p>
                </div>
            </div>
            <div class="mt-4 flex items-center justify-between border-t border-line pt-3">
                <span class="font-mono text-[11px] text-zinc-500" th:text="${c.phone()}">phone</span>
                <span class="rounded-sm bg-ink-700 px-2 py-0.5 font-mono text-[10px] uppercase tracking-[0.12em] text-zinc-400"
                      th:text="${c.vehicleCount()} + (${c.vehicleCount()} == 1 ? ' vehicle' : ' vehicles')">2 vehicles</span>
            </div>
        </a>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

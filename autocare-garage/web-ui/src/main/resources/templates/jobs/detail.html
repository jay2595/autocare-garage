<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Job detail')}"></head>
<body class="min-h-screen bg-ink-900 font-sans text-zinc-300 antialiased">

<header th:replace="~{fragments/layout :: nav('jobs')}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="mx-auto max-w-4xl px-6 py-10">

    <a href="/jobs" class="font-mono text-[11px] uppercase tracking-[0.15em] text-zinc-500 hover:text-amber-500">
        &larr; Job board
    </a>

    <div class="mt-4 rounded-sm border border-line border-l-4 bg-ink-800" th:classappend="${job.accentClass()}">
        <div class="border-b border-line px-7 py-6">
            <div class="flex flex-wrap items-start justify-between gap-4">
                <div>
                    <p class="font-mono text-xs text-zinc-600" th:text="'JOB #' + ${job.id()}">JOB #1</p>
                    <h1 class="mt-1 text-xl font-semibold tracking-tight text-zinc-50"
                        th:text="${job.description()}">Description</h1>
                </div>
                <span class="rounded-sm px-3 py-1.5 font-mono text-[11px] uppercase tracking-[0.12em] ring-1"
                      th:classappend="${job.badgeClass()}" th:text="${job.statusLabel()}">Status</span>
            </div>
        </div>

        <dl class="grid grid-cols-2 gap-px bg-line sm:grid-cols-4">
            <div class="bg-ink-800 px-7 py-5">
                <dt class="font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Vehicle</dt>
                <dd class="mt-1.5 text-sm text-zinc-100" th:text="${job.vehicleLabel()}">Vehicle</dd>
            </div>
            <div class="bg-ink-800 px-7 py-5">
                <dt class="font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Registration</dt>
                <dd class="mt-1.5 font-mono text-sm text-zinc-100" th:text="${job.registration()}">REG</dd>
            </div>
            <div class="bg-ink-800 px-7 py-5">
                <dt class="font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Mechanic</dt>
                <dd class="mt-1.5 text-sm text-zinc-100" th:text="${job.mechanicName()} ?: 'Unassigned'">-</dd>
            </div>
            <div class="bg-ink-800 px-7 py-5">
                <dt class="font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Estimate</dt>
                <dd class="mt-1.5 font-mono text-sm text-amber-500"
                    th:text="${job.costLabel()}">-</dd>
            </div>
            <div class="bg-ink-800 px-7 py-5" th:if="${job.vehicle()} != null">
                <dt class="font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Owner</dt>
                <dd class="mt-1.5 text-sm text-zinc-100" th:text="${job.vehicle().customerName()}">Owner</dd>
            </div>
            <div class="bg-ink-800 px-7 py-5" th:if="${job.vehicle()} != null">
                <dt class="font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Mileage</dt>
                <dd class="mt-1.5 font-mono text-sm text-zinc-100"
                    th:text="${job.mileageLabel()}">-</dd>
            </div>
            <div class="bg-ink-800 px-7 py-5">
                <dt class="font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Booked in</dt>
                <dd class="mt-1.5 font-mono text-sm text-zinc-100"
                    th:text="${job.createdAtLabel()}">-</dd>
            </div>
            <div class="bg-ink-800 px-7 py-5">
                <dt class="font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Closed</dt>
                <dd class="mt-1.5 font-mono text-sm text-zinc-100"
                    th:text="${job.completedAtLabel()}">-</dd>
            </div>
        </dl>

        <div class="border-t border-line px-7 py-6">
            <p class="mb-3 font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Move this job</p>
            <form th:action="@{'/jobs/' + ${job.id()} + '/status'}" method="post" class="flex flex-wrap gap-2">
                <button th:each="s : ${statuses}" type="submit" name="status" th:value="${s}"
                        class="rounded-sm border border-line bg-ink-700 px-3.5 py-2 font-mono text-[11px] uppercase tracking-[0.12em] text-zinc-300 transition hover:border-amber-600 hover:text-amber-400 disabled:opacity-30"
                        th:disabled="${job.status() == s}"
                        th:text="${#strings.replace(s, '_', ' ')}">STATUS
                </button>
            </form>
        </div>
    </div>

    <p th:unless="${job.hasVehicle()}"
       class="mt-4 rounded-sm border border-amber-900 border-l-4 border-l-amber-500 bg-amber-950/30 px-4 py-3 text-sm text-amber-300">
        Vehicle details could not be loaded from <span class="font-mono">customers-service</span>.
        The job itself is fine &mdash; this is the graceful degradation working as designed.
    </p>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book a job')}"></head>
<body class="min-h-screen bg-ink-900 font-sans text-zinc-300 antialiased">

<header th:replace="~{fragments/layout :: nav('jobs')}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="mx-auto max-w-2xl px-6 py-10">

    <a href="/jobs" class="font-mono text-[11px] uppercase tracking-[0.15em] text-zinc-500 hover:text-amber-500">
        &larr; Job board
    </a>
    <h1 class="mt-4 text-2xl font-bold tracking-tight text-zinc-50">Book a job in</h1>
    <p class="mt-1.5 text-sm text-zinc-500">
        The vehicle list comes from <span class="font-mono text-zinc-400">customers-service</span>,
        the mechanic list from <span class="font-mono text-zinc-400">workshop-service</span>.
    </p>

    <form action="/jobs" method="post" class="mt-8 space-y-5 rounded-sm border border-line bg-ink-800 p-7">

        <div>
            <label class="mb-1.5 block font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Vehicle</label>
            <select name="vehicleId" required
                    class="w-full rounded-sm border border-line bg-ink-700 px-3.5 py-2.5 text-sm text-zinc-100 outline-none focus:border-amber-600">
                <option value="">Select a vehicle...</option>
                <option th:each="v : ${vehicles}" th:value="${v.id()}"
                        th:text="${v.label()} + ' — ' + ${v.registrationNumber()} + ' (' + ${v.customerName()} + ')'"></option>
            </select>
            <p th:if="${#lists.isEmpty(vehicles)}" class="mt-1.5 text-xs text-red-400">
                No vehicles available — is customers-service running?
            </p>
        </div>

        <div>
            <label class="mb-1.5 block font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Mechanic</label>
            <select name="mechanicId"
                    class="w-full rounded-sm border border-line bg-ink-700 px-3.5 py-2.5 text-sm text-zinc-100 outline-none focus:border-amber-600">
                <option value="">Leave unassigned</option>
                <option th:each="m : ${mechanics}" th:value="${m.id()}" th:text="${m.fullName()}"></option>
            </select>
        </div>

        <div>
            <label class="mb-1.5 block font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">What needs doing</label>
            <textarea name="description" rows="3" required maxlength="500"
                      placeholder="Front brake pads and discs replacement"
                      class="w-full rounded-sm border border-line bg-ink-700 px-3.5 py-2.5 text-sm text-zinc-100 outline-none placeholder:text-zinc-600 focus:border-amber-600"></textarea>
        </div>

        <div>
            <label class="mb-1.5 block font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-500">Estimate</label>
            <input type="number" name="estimatedCost" step="0.01" min="0" placeholder="310.50"
                   class="w-full rounded-sm border border-line bg-ink-700 px-3.5 py-2.5 font-mono text-sm text-zinc-100 outline-none placeholder:text-zinc-600 focus:border-amber-600">
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit"
                    class="rounded-sm bg-amber-500 px-5 py-2.5 text-sm font-semibold text-ink-950 transition hover:bg-amber-400">
                Book it in
            </button>
            <a href="/jobs"
               class="rounded-sm border border-line px-5 py-2.5 text-sm text-zinc-400 transition hover:text-zinc-100">
                Cancel
            </a>
        </div>
    </form>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

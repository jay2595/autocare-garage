# workshop-service - owns mechanics, specialties and service jobs.
# Calls customers-service over cluster DNS to resolve vehicle details.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-service
  namespace: autocare
  labels:
    app: workshop-service
    app.kubernetes.io/part-of: autocare-garage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workshop-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: workshop-service
    spec:
      initContainers:
        # Spring Boot exits if it cannot reach the database on startup, and a
        # crashlooping app pod is a much noisier failure than a pending init
        # container. Wait for Postgres to accept connections first.
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-workshop -p 5432; do
                echo "waiting for postgres-workshop..."
                sleep 3
              done
      containers:
        - name: workshop-service
          image: acrautocarejay2595.azurecr.io/workshop-service:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            # PostgreSQL connection. The image has no idea it is talking to Postgres
            # rather than H2 - that is decided entirely by these variables.
            - name: DB_URL
              value: "jdbc:postgresql://postgres-workshop:5432/workshopdb"
            - name: DB_DRIVER
              value: "org.postgresql.Driver"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-workshop
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-workshop
                  key: password
            # update, not create-drop: the schema and the data must survive a
            # pod restart now that there is somewhere to survive to.
            - name: DDL_AUTO
              value: "update"
            # No hostnames hardcoded in the image - the same image runs locally
            # against localhost:8081 and here against cluster DNS.
            - name: CUSTOMERS_SERVICE_URL
              value: "http://customers-service:8081"
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=70.0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "150m"
            limits:
              memory: "768Mi"
              cpu: "500m"

          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 20

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Must match the UID baked into the Dockerfile. Kubernetes verifies
            # non-root by number, never by username.
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]

---
apiVersion: v1
kind: Service
metadata:
  name: workshop-service
  namespace: autocare
  labels:
    app: workshop-service
spec:
  type: ClusterIP
  selector:
    app: workshop-service
  ports:
    - name: http
      port: 8082
      targetPort: http
